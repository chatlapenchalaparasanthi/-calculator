<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<style>
* {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins';}
body {display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); transition: 0.3s;}
body.dark {background: linear-gradient(135deg, #000000, #434343);}
.calculator {background: #1e1e1e; padding: 15px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 380px;}
#display {width: 100%; height: 90px; font-size: 32px; text-align: right; margin-bottom: 15px; padding: 15px; border: none; background: #2a2a2a; color: white; border-radius: 15px;}
.top-bar {display: flex; gap: 10px; margin-bottom: 10px;}
.top-bar button {flex: 1; padding: 8px; border-radius: 10px; border: none; background: #444; color: white; font-size: 14px;}
.buttons {display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;}
button {height: 55px; font-size: 18px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.1s; color: white;}
button:active {transform: scale(0.92);}
.num {background: #3a3a3a;}
.op {background: #FF9500;}
.func {background: #5856D6; font-size: 15px;}
.clear {background: #FF3B30;}
.equal {background: #34C759; grid-column: span 2;}
</style>
</head>
<body>
<div class="calculator">
<div class="top-bar">
<button onclick="toggleDegRad()">DEG</button>
<button onclick="toggleTheme()">🌙</button>
<button onclick="toggleHistory()">📜</button>
</div>
<div id="history" style="color:#aaa; font-size:12px; max-height:80px; overflow-y:auto; display:none; margin-bottom:10px;"></div>
<input type="text" id="display" value="0" readonly>

<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button class="func" onclick="backspace()">⌫</button>
<button class="func" onclick="append(')">(</button>
<button class="func" onclick="append(')')">)</button>
<button class="func" onclick="append('^')">x^y</button>

<button class="func" onclick="sin()">sin</button>
<button class="func" onclick="cos()">cos</button>
<button class="func" onclick="tan()">tan</button>
<button class="func" onclick="log()">log</button>
<button class="func" onclick="ln()">ln</button>

<button class="func" onclick="sqrt()">√</button>
<button class="func" onclick="append('**2')">x²</button>
<button class="func" onclick="append('**0.5')">√x</button>
<button class="func" onclick="append('1/')">1/x</button>
<button class="func" onclick="append('PI')">π</button>

<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('/')">/</button>
<button class="func" onclick="append('%')">%</button>

<button class="num" onclick="append('4')">4</button>
<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="op" onclick="append('*')">*</button>
<button class="func" onclick="fact()">x!</button>

<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="op" onclick="append('-')">-</button>
<button class="func" onclick="append('E')">e</button>

<button class="num" onclick="append('0')">0</button>
<button class="num" onclick="append('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
<button class="op" onclick="append('+')">+</button>
</div>
</div>
<script>
let display = document.getElementById('display');
let historyDiv = document.getElementById('history');
let history = [];
let isDeg = true;

function append(val){
  if(display.value === '0') display.value = '';
  display.value += val;
}
function clearDisplay(){ display.value = '0'; }
function backspace(){ 
  display.value = display.value.slice(0,-1); 
  if(display.value === '') display.value = '0';
}
function toRad(x){ return isDeg ? x * Math.PI / 180 : x; }

function sin(){ display.value = Math.sin(toRad(parseFloat(display.value))); }
function cos(){ display.value = Math.cos(toRad(parseFloat(display.value))); }
function tan(){ display.value = Math.tan(toRad(parseFloat(display.value))); }
function log(){ display.value = Math.log10(parseFloat(display.value)); }
function ln(){ display.value = Math.log(parseFloat(display.value)); }
function sqrt(){ display.value = Math.sqrt(parseFloat(display.value)); }
function fact(){
  let n = parseInt(display.value);
  let f = 1;
  for(let i=2; i<=n; i++) f*=i;
  display.value = f;
}

function calculate(){
  try{
    let expr = display.value.replace(/\^/g, '**').replace(/PI/g, Math.PI).replace(/E/g, Math.E);
    let result = eval(expr);
    addHistory(display.value + ' = ' + result);
    display.value = result;
  }
  catch{ display.value = 'Error'; }
}
function addHistory(entry){
  history.unshift(entry);
  if(history.length > 5) history.pop();
  historyDiv.innerHTML = history.map(h => `<div>${h}</div>`).join('');
}
function toggleHistory(){
  historyDiv.style.display = historyDiv.style.display === 'block' ? 'none' : 'block';
}
function toggleDegRad(){
  isDeg = !isDeg;
  event.target.innerText = isDeg ? 'DEG' : 'RAD';
}
function toggleTheme(){
  document.body.classList.toggle('dark');
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if('0123456789.+-*/()%'.includes(e.key)) append(e.key);
  if(e.key === 'Enter') calculate();
  if(e.key === 'Backspace') backspace();
  if(e.key === 'Escape') clearDisplay();
});
</script>
</body>
</html>
