

  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Calculator</title>
<style>
* {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI';}
body {display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); transition: 0.3s;}
body.dark {background: linear-gradient(135deg, #1f1c2c, #928dab);}
.calculator {background: rgba(255,255,255,0.95); padding: 25px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 340px;}
body.dark .calculator {background: rgba(30,30,30,0.9);}
.top-bar {display: flex; justify-content: space-between; margin-bottom: 10px;}
#theme {background: #FFD93D; border: none; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 18px;}
#display {width: 100%; height: 70px; font-size: 32px; text-align: right; margin-bottom: 15px; padding: 15px; border: none; border-radius: 15px; background: #f1f1f1;}
body.dark #display {background: #333; color: white;}
.buttons {display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;}
button {height: 60px; font-size: 22px; border: none; border-radius: 15px; background: #667eea; color: white; cursor: pointer; font-weight: bold; transition: 0.2s;}
button:hover {transform: scale(0.95); background: #764ba2;}
button.op {background: #FF6B6B;}
button.equal {background: #2ed573; grid-column: span 2;}
button.clear {background: #ff4757;}
button.zero {grid-column: span 2;}
</style>
</head>
<body>
<div class="calculator">
<div class="top-bar">
<button id="theme" onclick="toggleTheme()">🌙</button>
</div>
<input type="text" id="display" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button class="op" onclick="backspace()">⌫</button>
<button class="op" onclick="append('%')">%</button>
<button class="op" onclick="append('/')">/</button>

<button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button><button class="op" onclick="append('*')">*</button>

<button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button><button class="op" onclick="append('-')">-</button>

<button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button><button class="op" onclick="append('+')">+</button>

<button onclick="append('0')" class="zero">0</button><button onclick="append('.')">.</button>
<button onclick="sqrt()">√</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>
<script>
function append(val){
  document.getElementById('display').value += val;
}
function clearDisplay(){
  document.getElementById('display').value = '';
}
function backspace(){
  let d = document.getElementById('display'); 
  d.value = d.value.slice(0,-1);
}
function sqrt(){
  let d = document.getElementById('display'); 
  d.value = Math.sqrt(eval(d.value || 0));
}
function calculate(){
  try{
    document.getElementById('display').value = eval(document.getElementById('display').value);
  }
  catch{
    document.getElementById('display').value = 'Error';
  }
} // <-- idhi miss ayyindi
function toggleTheme(){
  document.body.classList.toggle('dark');
} // <-- idhi kuda miss ayyindi
</script>
</body>
</html>
