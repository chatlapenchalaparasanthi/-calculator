<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator</title>
<style>
* {margin: 0; padding: 0; box-sizing: border-box;}
body {font-family: 'Segoe UI'; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2);}
.calculator {background: rgba(255,255,255,0.95); padding: 25px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);}
#display {width: 100%; height: 60px; font-size: 28px; text-align: right; margin-bottom: 15px; padding: 10px; border: 2px solid #667eea; border-radius: 10px;}
.buttons {display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;}
button {height: 55px; font-size: 20px; border: none; border-radius: 12px; background: #667eea; color: white; cursor: pointer; font-weight: bold;}
button:hover {background: #764ba2; transform: scale(0.95);}
button.zero {grid-column: span 2;}
button.clear {background: #ff4757;}
button.equal {background: #2ed573;}
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" readonly>
<div class="buttons">
<button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button><button onclick="append('/')">/</button>
<button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button><button onclick="append('*')">*</button>
<button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button><button onclick="append('-')">-</button>
<button onclick="append('0')" class="zero">0</button><button onclick="append('.')">.</button><button onclick="calculate()" class="equal">=</button>
<button onclick="append('+')">+</button>
<button onclick="clearDisplay()" class="clear" style="grid-column: span 4;">C Clear</button>
</div>
</div>
<script>
function append(val){document.getElementById('display').value += val;}
function clearDisplay(){document.getElementById('display').value = '';}
function calculate(){
  try{document.getElementById('display').value = eval(document.getElementById('display').value);}
